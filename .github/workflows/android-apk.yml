name: Build Android and Windows apps
on:
  pull_request:
    paths: ['android/**', 'windows/**', 'assets/icon-192.png', '.github/workflows/android-apk.yml']
  push:
    branches: [main]
    paths: ['android/**', 'windows/**', 'assets/icon-192.png', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build signed installable APK
        env:
          AGAZATY_SIGNING_KEY_B64: ${{ secrets.AGAZATY_SIGNING_KEY_B64 }}
          AGAZATY_SIGNING_PASSWORD: ${{ secrets.AGAZATY_SIGNING_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            gradle -p android --no-daemon :app:assembleDebug
            cp android/app/build/outputs/apk/debug/app-debug.apk agazaty-android-v1.3.7.apk
          else
            test -n "$AGAZATY_SIGNING_KEY_B64"
            test -n "$AGAZATY_SIGNING_PASSWORD"
            export AGAZATY_SIGNING_STORE="$RUNNER_TEMP/agazaty-release.jks"
            printf '%s' "$AGAZATY_SIGNING_KEY_B64" | base64 --decode > "$AGAZATY_SIGNING_STORE"
            gradle -p android --no-daemon :app:assembleRelease
            cp android/app/build/outputs/apk/release/app-release.apk agazaty-android-v1.3.7.apk
          fi
          test -s agazaty-android-v1.3.7.apk
      - name: Verify APK identity and signature
        run: |
          APK=agazaty-android-v1.3.7.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.ahmedmorgan.agazaty.mobile' versionCode='11' versionName='1.3.7'"
      - uses: actions/upload-artifact@v4
        with:
          name: agazaty-android-apk
          path: agazaty-android-v1.3.7.apk
  install-test:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agazaty-android-apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb install agazaty-android-v1.3.7.apk
            adb shell pm path com.ahmedmorgan.agazaty.mobile
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Windows app
        run: dotnet publish windows/Agazaty.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o windows/dist
      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path windows/dist/Agazaty.exe -DestinationPath agazaty-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: agazaty-windows
          path: agazaty-windows.zip
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, install-test, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: agazaty-*
          merge-multiple: true
          path: release
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.3.7 >/dev/null 2>&1; then
            gh release upload v1.3.7 release/agazaty-android-v1.3.7.apk release/agazaty-windows.zip --clobber
          else
            gh release create v1.3.7 release/agazaty-android-v1.3.7.apk release/agazaty-windows.zip --title 'أجازاتي 1.3.7' --notes 'حزمة أندرويد جديدة تُثبّت بجانب النسخ القديمة، مع التحقق من توقيع APK وتجربة تثبيته على محاكي قبل النشر.' --latest
          fi
      - name: Publish APK on website
        run: |
          git pull --rebase origin main
          cp release/agazaty-android-v1.3.7.apk public/agazaty-android-v1.3.7.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/agazaty-android-v1.3.7.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Publish signed Android 1.3.7 APK'
            git push origin HEAD:main
          fi

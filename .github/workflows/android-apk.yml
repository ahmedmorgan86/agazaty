name: Build Android APK
on:
  pull_request:
    paths: ['android/**', 'assets/icon-192.png', '.github/workflows/android-apk.yml']
  push:
    branches: [main]
    paths: ['android/**', 'assets/icon-192.png', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build installable APK
        run: |
          gradle -p android --no-daemon :app:assembleDebug
          cp android/app/build/outputs/apk/debug/app-debug.apk agazaty-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: agazaty-android-apk
          path: agazaty-android.apk
      - name: Publish download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create android-v1.2.0 agazaty-android.apk --title 'أجازاتي Android 1.2.0' --notes 'أيقونة أجازاتى الجديدة. نسخة APK للتثبيت المباشر وتحتاج إلى اتصال بالإنترنت.' --latest

plugins { id 'com.android.application' }

android {
    namespace 'com.ahmedmorgan.agazaty'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ahmedmorgan.agazaty.mobile'
        minSdk 23
        targetSdk 35
        versionCode 12
        versionName '1.3.8'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('AGAZATY_SIGNING_STORE') ?: 'missing-release-key.jks')
            storePassword System.getenv('AGAZATY_SIGNING_PASSWORD') ?: ''
            keyAlias 'agazaty'
            keyPassword System.getenv('AGAZATY_SIGNING_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
